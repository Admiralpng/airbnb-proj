services:
  - type: web
    name: airbnb-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard, not here:
      #   MONGODB_URI  mongodb+srv://<user>:<password>@zaiocustomairbnb.ammcsi5.mongodb.net/airbnb?retryWrites=true&w=majority
      #   JWT_SECRET   <long random string>
      #   CLIENT_ORIGIN  https://<your-site>.netlify.app